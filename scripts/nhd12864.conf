# Reference shell configuration for the Orange Pi Zero 2W NHD test/demo.
# These values mirror the compiled defaults; lcd does not load this file.
# Reserved elsewhere in the rig:
# UART5=226,227; UART2=261,262; I2C1=264,263; I2C2=266,265;
# Waveshare relay CH1/CH2/CH3=272,260,259.
MODEL=nhd
SPIDEV=/dev/spidev1.0
GPIOCHIP=/dev/gpiochip0
DC_LINE=271
RST_LINE=256
SPI_HZ=8000000
CONTRAST=17
FONT=fonts/unifont-17.0.03.otf
INTERVAL_MS=500
ITERATIONS=0
